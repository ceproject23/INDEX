<div class="card">
<h2>Python - Binary Search</h2>
<textarea id="code1" readonly>
def binary_search(a, x):
    l, r = 0, len(a)-1
    while l <= r:
        m = (l+r)//2
        if a[m] == x:
            return m
        elif a[m] < x:
            l = m+1
        else:
            r = m-1
    return -1

a = [10, 20, 30, 40, 50]
print(binary_search(a, 30))
</textarea>
<button onclick="copyCode('code1')">Copy Code</button>
</div>

<div class="card">
<h2>C - Add your program here</h2>
<textarea id="code2" readonly>
Paste your C program here.
</textarea>
<button onclick="copyCode('code2')">Copy Code</button>
</div>

<script>
function copyCode(id) {
  let box = document.getElementById(id);
  box.select();
  navigator.clipboard.writeText(box.value)
    .then(() => alert("Code copied!"))
    .catch(() => {
      document.execCommand("copy");
      alert("Code copied!");
    });
}
</script>
